[build]
  command = "npm run build"
  publish = ".next"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20.18.0"
  
[functions."update-eqx-price"]
schedule = "0 * * * *"

[functions."update-fx-rates"]
schedule = "0 * * * *"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
