[build]
  command = "npm run prebuild && npm run build"
  functions = "netlify/functions"
  # publish is intentionally omitted — @netlify/plugin-nextjs sets it.

[build.environment]
  NODE_VERSION = "20.18.0"

[functions."update-unx-price"]
schedule = "0 * * * *"

[functions."update-fx-rates"]
schedule = "0 * * * *"

[functions."snapshot-daily-performance"]
schedule = "0 0 * * *"
