[build]
  command = "npm run prebuild && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20.18.0"

[functions]
  directory = "netlify/functions"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Scheduled functions
[functions."update-eqx-price"]
  schedule = "0 * * * *"

[functions."update-fx-rates"]
  schedule = "0 * * * *"

# NOTE: No redirects needed - @netlify/plugin-nextjs handles all routing automatically
# Adding manual redirects can break Next.js App Router functionality
