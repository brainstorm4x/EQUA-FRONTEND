<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Gold gradient for coin -->
    <radialGradient id="goldGradient" cx="50%" cy="40%">
      <stop offset="0%" style="stop-color:#f9d71c;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f4c430;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4af37;stop-opacity:1" />
    </radialGradient>
    
    <!-- Inner face gradient -->
    <radialGradient id="innerGradient" cx="50%" cy="40%">
      <stop offset="0%" style="stop-color:#fce570;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8b923;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Outer coin circle -->
  <circle cx="100" cy="100" r="96" fill="url(#goldGradient)" stroke="#b8860b" stroke-width="2" />
  
  <!-- Inner rim -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#c9a329" stroke-width="2" opacity="0.6" />
  
  <!-- Inner coin face -->
  <circle cx="100" cy="100" r="82" fill="url(#innerGradient)" />
  
  <!-- Inner detail circle -->
  <circle cx="100" cy="100" r="76" fill="none" stroke="#d4a11d" stroke-width="1.5" opacity="0.5" />
  
  <!-- Three circles at top (community/people symbol) -->
  <circle cx="70" cy="60" r="12" fill="#b8860b" />
  <circle cx="100" cy="55" r="13" fill="#b8860b" />
  <circle cx="130" cy="60" r="12" fill="#b8860b" />
  
  <!-- Two horizontal bars forming the "E" pattern -->
  <rect x="60" y="95" width="80" height="12" rx="2" fill="#b8860b" />
  <rect x="60" y="120" width="80" height="12" rx="2" fill="#b8860b" />
  
  <!-- Vertical support bars on sides -->
  <rect x="55" y="85" width="10" height="60" rx="2" fill="#b8860b" />
  <rect x="135" y="85" width="10" height="60" rx="2" fill="#b8860b" />
  
  <!-- Subtle highlight for 3D effect -->
  <ellipse cx="100" cy="50" rx="35" ry="18" fill="#fff" opacity="0.12" />
</svg>
